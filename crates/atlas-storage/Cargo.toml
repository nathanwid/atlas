[package]
name = "atlas-storage"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
atlas-embedding = { path = "../atlas-embedding" }
atlas-graph = { path = "../atlas-graph" }
atlas-tokenizer = { path = "../atlas-tokenizer" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
surrealdb.workspace = true
tokio.workspace = true
rusqlite = { workspace = true, optional = true }

[features]
# Opt-in SQLite backend (storage PoC). SurrealDB stays the default; nothing
# outside this crate's tests/benches depends on the feature.
sqlite-backend = ["dep:rusqlite"]

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true
tempfile = "3.27"

[[bench]]
name = "hardening"
harness = false

[[bench]]
name = "sqlite_durability"
harness = false
required-features = ["sqlite-backend"]
